name: Build & Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: GitHub issues a short-lived OIDC token that npm
  # accepts instead of a stored npm token. Also signs provenance.
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # This job never pushes, so don't leave git credentials on disk
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/
          # No dependency cache in the release job: a cache written by another
          # workflow run could otherwise end up in the published package
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build SDK
        run: npm run build

      # Authenticates through trusted publishing (configured on npmjs.com for
      # this repo + publish.yml), so no NPM_TOKEN secret is needed
      - name: Publish to NPM
        run: npm publish --access public --provenance
